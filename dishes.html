<html lang="en">
<head>
    <title>Online Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url(images/background.png);
        }

        header {
            background-color: #F8BD47;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        main {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 20px;
        }

        .dish {
        background-color: #F8BD47;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 10px;
        padding: 20px;
        text-align: center;
        width: 300px;
        }

        .dish img {
        max-width: 100%;
        border-radius: 8px;
        }

        .dish h2 {
        color: #333;
        font-family: poppins;
        }

        .price {
            color: #333;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .add-to-cart {
            background-color: #333;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px 20px;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .add-to-cart:hover {
            background-color: black;
        }

        h1 {
            color: black;
            font-size: 40px;
            font-family: poppins;
        }

        .continue-payment {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 30px; 
            text-transform: uppercase;
            cursor: pointer;
            font-size: 20px; 
            border-radius: 5px;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto; 
        }


        .continue-payment:hover {
            background-color: #444;
        }

        .payment {
            color: #333;
            text-decoration: none;
            background-color: #F8BD47;
            font-size: 40px;
            text-align: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Our Specials!&#128523;</h1>
    </header>
    <main>
        <form action="act.php" method="POST" id="order-form">
            <div class="dish" id="dish-1">
                <img src="images/biriyani.png" alt="Biriyani">
                <h2>Biriyani</h2>
                <p class="description">Authentic Spicy Biriyani.</p>
                <p class="price">130/-</p>
                <input type="hidden" name="food_id[]" value="101">
                <label for="quantity-1">Quantity:</label>
                <input type="number" id="quantity-1" name="quantity[]" min="1" max="20" class="quantity-input"><br><br>
            </div>
            <div class="dish" id="dish-2">
                <img src="images/Mandhi.png" alt="Mandhi">
                <h2>Mandhi</h2>
                <p class="description">Arabian Special Mandhi</p>
                <p class="price">150/-</p>
                <input type="hidden" name="food_id[]" value="102">
                <label for="quantity-2">Quantity:</label>
                <input type="number" id="quantity-2" name="quantity[]" min="1" max="20" class="quantity-input"><br><br>
            </div>
            <div class="dish" id="dish-3">
                <img src="images/Fried.png" alt="Fried Chicken">
                <h2>Fried Chicken</h2>
                <p class="description">Tasty crispy fried chicken</p>
                <p class="price">140/-</p>
                <input type="hidden" name="food_id[]" value="103">
                <label for="quantity-3">Quantity:</label>
                <input type="number" id="quantity-3" name="quantity[]" min="1" max="20" class="quantity-input"><br><br>
            </div>
            <button type="submit" class="continue-payment">Continue & Payment</button>
        </form>
    </main>

    <script>
        document.getElementById('order-form').addEventListener('submit', function(event) {
            var customer_id = getCustomerId();
            if (customer_id) {
                var hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'customer_id';
                hiddenInput.value = customer_id;
                this.appendChild(hiddenInput);
            } else {
                event.preventDefault(); 
                alert('Customer ID is missing!');
            }
        });
        function getCustomerId() {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('customer_id');
        }
    </script>
</body>
</html>
